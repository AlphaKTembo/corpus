name: Deploy To Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_APP_PATH: ${{ secrets.SERVER_APP_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing required secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_PRIVATE_KEY"
            exit 1
          fi

          PORT="${SERVER_PORT:-22}"
          APP_PATH="${SERVER_APP_PATH:-/www/wwwroot/corpus.kurasika.tech}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p "$PORT" "$SERVER_USER@$SERVER_HOST" "APP_PATH='$APP_PATH' bash -s" <<'EOF'
            set -euo pipefail
            if [ ! -d "$APP_PATH/.git" ]; then
              echo "App path is not a git repository: $APP_PATH"
              exit 1
            fi
            git -c safe.directory="$APP_PATH" -C "$APP_PATH" fetch --all --prune
            git -c safe.directory="$APP_PATH" -C "$APP_PATH" reset --hard origin/main
            if [ -f "$APP_PATH/infra/docker-compose.yml" ]; then
              docker compose -f "$APP_PATH/infra/docker-compose.yml" up -d --build
            fi
          EOF
