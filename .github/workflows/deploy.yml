name: Deploy To Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_APP_PATH: ${{ secrets.SERVER_APP_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing required secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_PRIVATE_KEY"
            exit 1
          fi

          PORT="${SERVER_PORT:-22}"
          APP_PATH="${SERVER_APP_PATH:-/www/wwwroot/corpus.kurasika.tech}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SERVER_USER@$SERVER_HOST" "APP_PATH='$APP_PATH' bash -s" <<'EOF'
            set -euo pipefail
            cd "$APP_PATH"
            git fetch --all --prune
            git reset --hard origin/main
            if [ -f "infra/docker-compose.yml" ]; then
              docker compose -f infra/docker-compose.yml up -d --build
            fi
          EOF
